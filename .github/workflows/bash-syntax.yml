name: Bash syntax
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts
        run: |
          bash -n bootstrap.sh
          bash -n configure-netbird.sh
          bash -n finalize-ssh.sh
          bash -n enable-firewall.sh
