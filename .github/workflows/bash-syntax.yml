name: Edge-node contracts
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run contract suite
        run: bash tests/contract.sh
      - name: Run ShellCheck
        run: shellcheck -x bootstrap.sh configure-netbird.sh finalize-ssh.sh enable-firewall.sh provision.sh lib/edge-lib.sh tests/contract.sh
